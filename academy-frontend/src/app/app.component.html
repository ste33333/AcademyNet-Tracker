<app-navbar></app-navbar>

<div class="container-fluid">
  <div class="row">
    <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse vh-100 border-end pt-3">
      <div class="position-sticky">
        <ul class="nav flex-column">
          @if (isLoggedIn$ | async) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/workers" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                <i class="bi bi-people-fill me-2"></i> Workers
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/weekworks" routerLinkActive="active">
                <i class="bi bi-calendar-week me-2"></i> WeekWorks
              </a>
            </li>
            <li class="nav-item mt-auto pt-3 border-top">
               <button class="nav-link text-danger" type="button" (click)="logout()" style="border:none; background:none; width:100%; text-align: left;">
                 <i class="bi bi-box-arrow-left me-2"></i> Logout
               </button>
           </li>
          } @else {
            <li class="nav-item">
              <a class="nav-link" routerLink="/login" routerLinkActive="active">
                <i class="bi bi-box-arrow-in-right me-2"></i> Login
              </a>
            </li>
          }
        </ul>
      </div>
    </nav>

    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-3">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
